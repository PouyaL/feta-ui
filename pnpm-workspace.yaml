packages:
  - packages/*
  - components

# pnpm 10 skips dependency build scripts unless a package is listed here.
allowBuilds:
  esbuild: true

# Fail the install, instead of warning, when a dependency not listed above wants to run a build script.
strictDepBuilds: true

# Refuse versions published less than a day ago (minutes), so a hijacked release has time to be pulled.
minimumReleaseAge: 1440

overrides:
  'minimatch@>=7 <11.0.1': ^11.0.8
